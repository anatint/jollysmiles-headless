        active: true
      - title: "Smile Makeover 2"
        beforeImage: "/before-2.jpg"
        afterImage: "/after-2.jpg"
        order: 2
        active: true
      - title: "Smile Makeover 3"
        beforeImage: "/before-3.png"
        afterImage: "/after-3.jpg"
        order: 3
        active: true
      - title: "Smile Makeover 4"
        beforeImage: "/before-4-new.png"
        afterImage: "/after-4.jpg"
        order: 4
