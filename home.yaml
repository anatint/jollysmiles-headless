  services:
    eyebrow: "OUR SERVICES"
    heading: "Comprehensive Dental Care for Every Smile"
    description: "From routine checkups to advanced cosmetic transformations, we provide personalized care tailored to you."
    items:
      - title: "General Dentistry"
        description: "Routine cleanings, exams, and preventive care to keep your smile healthy."
        url: "/services/general-dentistry"
        icon: "shield"
        order: 1
      - title: "Cosmetic Dentistry"
        description: "Teeth whitening, veneers, and smile makeovers for a confident smile."
        url: "/services/cosmetic-dentistry"
        icon: "sparkles"
        order: 2
      - title: "Dental Implants"
        description: "Permanent, natural-looking tooth replacements for missing teeth."
        url: "/services/dental-implants"
        icon: "award"
        order: 3
      - title: "Invisalign® & Braces"
        description: "Discreet orthodontic solutions to straighten your teeth comfortably."
        url: "/services/invisalign"
        icon: "star"
        order: 4
      - title: "Emergency Dental Care"
        description: "Same-day urgent dental appointments when you need relief fast."
        url: "/services/emergency-care"
        icon: "activity"
        order: 5
      - title: "LANAP® Laser Treatment"
        description: "Advanced, minimally invasive gum disease treatment without scalpels."
        url: "/services/lanap-treatment"
        icon: "zap"
        order: 6

