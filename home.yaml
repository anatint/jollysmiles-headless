        title: "Treatment Plan"
        description: "Personalized plan just for you."
        icon: "map"
        order: 3
        active: true
      - stepNumber: "4"
        title: "Smile Transformation"
        description: "Achieve the healthy, beautiful smile you deserve."
        icon: "smile"
        order: 4
        active: true

