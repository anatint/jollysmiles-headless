    heading: "Transform Your Smile, Transform Your Life."
    highlightedWord: "Transform Your Life."
    description: "Advanced technology, personalized care, and a team that truly cares about your smile."
    backgroundImage: "/hero-background.png"
    primaryButton:
      label: "Book An Appointment"
      action: "appointment-modal"
    secondaryButton:
      label: "Free Consultation"
      url: "/contact"
    invisalignBadge:
      title: "Invisalign Provider"
      subtitle: "Top 1% Provider"

  stats:
