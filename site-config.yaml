      introHeading: "A More Confident Smile Starts Here"
      ctaPrimaryLabel: "Book Appointment"
      ctaSecondaryLabel: "Consult Our Experts"

  serviceFeatures:
    cosmetic-dentistry:
      - order: 1
        title: "Teeth Whitening"
        subtitle: "Brighten your smile safely and effectively."
        description: "Brighten your smile with safe and effective professional whitening treatments. Remove everyday stains and restore a brighter, more youthful appearance."
        tags:
          - "Professional Whitening"
          - "Safe Treatment"
          - "Brighter Smile"
        image: "/after-4.jpg"
        alignLeft: true
      - order: 2
        title: "Porcelain Veneers"
        subtitle: "Correct chips, gaps, or uneven teeth."
        description: "Thin, custom-made porcelain shells can cover imperfections and create a natural-looking, balanced smile."
        tags:
          - "Natural Looking"
          - "Custom Designed"
          - "Minimally Invasive"
        image: "/after-3.jpg"
        alignLeft: false
      - order: 3
        title: "Smile Makeovers"
        subtitle: "Personalized treatment plans tailored to your goals."
        description: "Combine whitening, veneers, bonding and contouring to create a smile that looks beautiful and feels natural."
        tags:
          - "Personalized Plan"
          - "Smile Design"
          - "Natural Results"
        image: "/dr-roberts.png"
        alignLeft: true
      - order: 4
        title: "Cosmetic Dentist in Middletown"
        subtitle: "A trusted cosmetic dentist you can count on."
        description: "Whether you want a subtle change or a complete transformation, our experienced team guides you through every step."
        tags:
          - "Experienced Team"
          - "Personalized Care"
          - "Middletown"
        image: "/clinic-reception.png"
        alignLeft: false

    dental-implants:
      - order: 1
        title: "Single Tooth Implants"
        subtitle: "Replace a single missing tooth seamlessly."
        description: "A medical-grade titanium implant acts as a replacement root and supports a custom porcelain crown that blends with surrounding teeth."
        tags:
          - "Natural Looking"
          - "Permanent Solution"
          - "Restores Function"
        image: "/before-3.png"
        alignLeft: true
      - order: 2
        title: "Implant-Supported Bridges"
        subtitle: "Sturdy replacement for multiple adjacent missing teeth."
        description: "Implant-supported bridges provide a secure, permanent solution without relying on adjacent healthy teeth for support."
        tags:
          - "Stable Support"
          - "Multiple Teeth"
          - "Natural Appearance"
        image: "/after-3.jpg"
        alignLeft: false
      - order: 3
        title: "All-on-4® Dental Implants"
        subtitle: "Complete full-arch restoration in a single day."
        description: "A full arch of missing teeth can be replaced using four strategically placed implants for a secure, permanent restoration."
        tags:
          - "Full Arch"
          - "Secure"
          - "Restores Chewing"
        image: "/after-1.jpg"
        alignLeft: true
      - order: 4
        title: "Bone Grafting & Sinus Lifts"
        subtitle: "Preparing your jaw for successful implant placement."
        description: "Bone grafting and sinus lifts can rebuild bone volume and create a strong foundation for long-term implant success."
        tags:
          - "Bone Support"
          - "Implant Preparation"
          - "Long-Term Success"
        image: "/clinic-reception.png"
        alignLeft: false

    invisalign:
